name: Apply full Replit export conversion

on:
  push:
    branches:
      - migration/full-replit-code-2026

permissions:
  contents: write
  issues: read

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[full-replit-applied]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct sanitized converted source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import io
          import json
          import lzma
          import os
          import pathlib
          import subprocess
          import tarfile

          repo = os.environ["GITHUB_REPOSITORY"]
          raw = subprocess.check_output(
              ["gh", "api", f"repos/{repo}/issues/2/comments?per_page=100"],
              text=True,
          )
          comments = json.loads(raw)
          parts = {}
          for comment in comments:
              body = comment.get("body") or ""
              if not body.startswith("ALTGC_DELTA_PART_"):
                  continue
              header, payload = body.split("\n", 1)
              idx = int(header.rsplit("_", 1)[1])
              parts[idx] = payload.strip()

          expected_lengths = [20000, 60000, 60000, 60000, 60000, 60000, 60000, 60000, 60000, 31865]
          if sorted(parts) != list(range(10)):
              raise SystemExit(f"Missing payload parts: got {sorted(parts)}")
          for idx, expected in enumerate(expected_lengths):
              actual = len(parts[idx])
              if actual != expected:
                  raise SystemExit(f"Payload part {idx:02d} length {actual}, expected {expected}")

          encoded = "".join(parts[i] for i in range(10))
          if len(encoded) != 531865:
              raise SystemExit(f"Encoded payload length {len(encoded)} != 531865")
          encoded_sha = hashlib.sha256(encoded.encode("ascii")).hexdigest()
          if encoded_sha != "f4705e05680f52f786ebf82ed113ecf6c70c0b63c0da2324c420b20ad7b85432":
              raise SystemExit(f"Encoded payload SHA mismatch: {encoded_sha}")

          compressed = base64.b85decode(encoded.encode("ascii"))
          compressed_sha = hashlib.sha256(compressed).hexdigest()
          if compressed_sha != "a172cf9be7d0ffcf86d28723f312e0b3d4f3e23fd4aa448de2c6c1ec2299eb7d":
              raise SystemExit(f"Compressed payload SHA mismatch: {compressed_sha}")

          tar_bytes = lzma.decompress(compressed)
          with tarfile.open(fileobj=io.BytesIO(tar_bytes), mode="r:") as tf:
              root = pathlib.Path.cwd().resolve()
              members = tf.getmembers()
              for member in members:
                  target = (root / member.name).resolve()
                  if root != target and root not in target.parents:
                      raise SystemExit(f"Unsafe archive path: {member.name}")
                  if member.issym() or member.islnk():
                      raise SystemExit(f"Links are not permitted in migration payload: {member.name}")
              tf.extractall(path=root, members=members, filter="data")

          print(f"Applied {len(members)} sanitized converted payload entries.")
          PY

      - name: Remove Replit-only and temporary migration files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .replit
          rm -f vite-plugin-meta-images.ts
          rm -f .github/workflows/apply-full-replit-export.yml

      - name: Commit converted full application
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && { echo "No migration changes found."; exit 1; }
          git commit -m "[full-replit-applied] Apply converted full ALT Game Center source"
          git push origin HEAD:migration/full-replit-code-2026
